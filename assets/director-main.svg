<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="760" fill="url(#bgGrad)" />
  <rect width="640" height="760" fill="url(#grid)" />

  <!-- Decorative glowing orb -->
  <circle cx="480" cy="180" r="220" fill="url(#accentGrad)" />
  <circle cx="140" cy="580" r="180" fill="url(#accentGrad)" />

  <!-- Subtle background analytics chart -->
  <g opacity="0.22" transform="translate(60, 120)">
    <polyline fill="none" stroke="#3b82f6" stroke-width="3" points="0,180 90,140 180,155 270,95 360,110 450,40 520,10" />
    <circle cx="270" cy="95" r="5" fill="#3b82f6" />
    <circle cx="450" cy="40" r="5" fill="#3b82f6" />
    <circle cx="520" cy="10" r="6" fill="#10b981" />
  </g>

  <!-- Stylized Executive Silhouette -->
  <g transform="translate(120, 150)">
    <!-- Shoulders / Suit -->
    <path d="M 30 560 C 30 410, 110 355, 200 355 C 290 355, 370 410, 370 560 Z" fill="url(#suitGrad)" stroke="#475569" stroke-width="2" />
    <!-- Shirt & Tie -->
    <polygon points="165,358 200,455 235,358" fill="#e2e8f0" opacity="0.9" />
    <polygon points="193,375 207,375 212,465 200,485 188,465" fill="#2563eb" />
    <!-- Lapels -->
    <path d="M 155 360 L 185 470 L 140 430 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <path d="M 245 360 L 215 470 L 260 430 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <!-- Neck -->
    <rect x="172" y="295" width="56" height="68" rx="22" fill="#64748b" />
    <!-- Head -->
    <rect x="135" y="120" width="130" height="175" rx="62" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
    <!-- Stylized hair / contour -->
    <path d="M 135 175 C 135 115, 265 115, 265 175 C 260 142, 140 142, 135 175 Z" fill="#475569" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="600" height="720" rx="16" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

  <!-- Top Badge -->
  <g transform="translate(44, 44)">
    <rect width="268" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="36" y="23" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.06em">ЗАПАЙКА: ФОТО РУКОВОДИТЕЛЯ</text>
  </g>

  <!-- Bottom Info Plate -->
  <g transform="translate(44, 616)">
    <rect width="552" height="84" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1" />
    <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Место для вашего портретного фото</text>
    <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Андрей Сахаров • Основатель и ведущий консультант «За гранью продаж»</text>
  </g>
</svg>
