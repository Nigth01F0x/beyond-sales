      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sessionBg)" />
  
  <!-- Board / Org chart illustration -->
  <g transform="translate(130, 75)" opacity="0.85">
