    <text x="170" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">РОП (ЦКП)</text>
    
    <line x1="170" y1="42" x2="170" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="55" y1="75" x2="285" y2="75" stroke="#475569" stroke-width="2" />
    <line x1="55" y1="75" x2="55" y2="100" stroke="#475569" stroke-width="2" />
    <line x1="170" y1="75" x2="170" y2="100" stroke="#475569" stroke-width="2" />
    <line x1="285" y1="75" x2="285" y2="100" stroke="#475569" stroke-width="2" />

    <rect x="0" y="100" width="110" height="44" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#cbd5e1">Лидоруб (MQL/SQL)</text>

    <rect x="115" y="100" width="110" height="44" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="170" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#cbd5e1">Хантер (Сделки)</text>

    <rect x="230" y="100" width="110" height="44" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="285" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#cbd5e1">Фармер (LTV)</text>
  </g>

  <rect x="16" y="16" width="568" height="368" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5" />

  <g transform="translate(32, 32)">
    <rect width="260" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1" />
