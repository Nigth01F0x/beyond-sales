  </g>

  <g transform="translate(32, 296)">
    <rect width="536" height="68" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Дополнительное фото: стратегическая сессия или выступление</text>
    <text x="18" y="48" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">Замените на свое фото с командой, клиентами или на фоне флипчарта/CRM</text>
